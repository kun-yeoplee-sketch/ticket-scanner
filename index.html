<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ticket Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 0; background: #121212; color: #fff; }
    #header { background: #333; padding: 15px; text-align: center; position: relative; }
    #queue-badge { display: none; background: #ff9800; color: #000; padding: 5px 10px; border-radius: 20px; font-weight: bold; position: absolute; top: 15px; right: 15px; font-size: 12px; }
    #reader { width: 100%; max-width: 500px; margin: 0 auto; background: #000; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; padding-top: 50px; }
    .modal-content { background: #222; margin: auto; padding: 20px; width: 90%; max-width: 400px; border-radius: 10px; text-align: center; }
    
    /* Keypad Styles */
    .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
    .key-btn { background: #444; color: white; border: none; padding: 20px; font-size: 24px; border-radius: 8px; cursor: pointer; }
    .key-btn:active { background: #666; }
    .submit-btn { background: #4CAF50; color: white; border: none; padding: 15px; width: 100%; font-size: 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    
    #status-banner { text-align: center; padding: 10px; font-weight: bold; display: none; }
    .offline-banner { background: #f44336; color: white; }
    .online-banner { background: #4CAF50; color: white; }
  </style>
</head>
<body>

  <div id="header">
    <h2>Scanner Entrance</h2>
    <div id="queue-badge">⚠️ Queue: 0</div>
  </div>
  
  <div id="status-banner"></div>
  <div id="reader"></div>

  <div id="offline-modal" class="modal">
    <div class="modal-content">
      <h2 style="color: #f44336;">⚠️ Device Offline</h2>
      <p>How many guests are checking in?</p>
      <h1 id="offline-qty" style="font-size: 48px; margin: 10px 0;">1</h1>
      
      <div class="keypad-grid">
        <button class="key-btn" onclick="setOfflineQty(1)">1</button>
        <button class="key-btn" onclick="setOfflineQty(2)">2</button>
        <button class="key-btn" onclick="setOfflineQty(3)">3</button>
        <button class="key-btn" onclick="setOfflineQty(4)">4</button>
        <button class="key-btn" onclick="setOfflineQty(5)">5</button>
        <button class="key-btn" onclick="setOfflineQty(6)">6</button>
      </div>
      
      <button class="submit-btn" onclick="saveOfflineScan()">Confirm Admission</button>
      <button style="background: transparent; border: none; color: #888; margin-top: 15px; font-size: 16px;" onclick="closeModal()">Cancel</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const backendUrl = urlParams.get('backend');
    let html5QrcodeScanner;
    let currentOfflineQr = "";
    let currentQty = 1;

    // --- Core Scanner Logic ---
    function onScanSuccess(decodedText) {
      html5QrcodeScanner.pause(true);
      
      if (navigator.onLine) {
        // ONLINE: Normal process (Add your normal online check/admit UI here)
        // For brevity, assuming simple instant submission online
        processOnlineAdmission(decodedText);
      } else {
        // OFFLINE: Trigger the keypad
        currentOfflineQr = decodedText;
        setOfflineQty(1);
        document.getElementById('offline-modal').style.display = 'block';
      }
    }

    // --- Offline Keypad Logic ---
    function setOfflineQty(num) {
      currentQty = num;
      document.getElementById('offline-qty').innerText = currentQty;
    }

    function closeModal() {
      document.getElementById('offline-modal').style.display = 'none';
      setTimeout(() => html5QrcodeScanner.resume(), 1000);
    }

    function saveOfflineScan() {
      const queue = JSON.parse(localStorage.getItem('syncQueue') || '[]');
      queue.push({
        action: 'processAdmission',
        ticketId: currentOfflineQr,
        rowIndex: null, // Unknown while offline
        count: currentQty,
        usherName: 'Scanner User',
        ticketSummary: 'Processed Offline'
      });
      
      localStorage.setItem('syncQueue', JSON.stringify(queue));
      updateQueueBadge();
      closeModal();
      showBanner('Saved offline!', 'offline-banner');
    }

    // --- Background Sync Engine ---
    function updateQueueBadge() {
      const queue = JSON.parse(localStorage.getItem('syncQueue') || '[]');
      const badge = document.getElementById('queue-badge');
      if (queue.length > 0) {
        badge.innerText = `⚠️ Queue: ${queue.length}`;
        badge.style.display = 'block';
      } else {
        badge.style.display = 'none';
      }
    }

    async function processOnlineAdmission(qrText) {
      // Your standard online fetch request goes here.
      // Once finished: setTimeout(() => html5QrcodeScanner.resume(), 2000);
    }

    setInterval(async () => {
      if (!navigator.onLine) return;
      
      const queue = JSON.parse(localStorage.getItem('syncQueue') || '[]');
      if (queue.length === 0) return;

      const payload = queue[0]; // Take oldest item
      
      try {
        const response = await fetch(backendUrl, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        
        if (result.success) {
          queue.shift(); // Remove from queue if successful
          localStorage.setItem('syncQueue', JSON.stringify(queue));
          updateQueueBadge();
        }
      } catch (err) {
        console.error("Sync failed, will retry:", err);
      }
    }, 10000); // Check every 10 seconds

    // --- Utilities ---
    function showBanner(text, className) {
      const banner = document.getElementById('status-banner');
      banner.innerText = text;
      banner.className = className;
      banner.style.display = 'block';
      setTimeout(() => banner.style.display = 'none', 3000);
    }

    window.onload = () => {
      updateQueueBadge();
      html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} });
      html5QrcodeScanner.render(onScanSuccess);
    };
  </script>
</body>
</html>
